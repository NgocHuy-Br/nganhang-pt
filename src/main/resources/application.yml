spring:
  application:
    name: nganhang-pt
  
  # Disable JPA auto-configuration (we'll use JDBC directly for stored procedures)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  
  # SQL Server - NGANHANG (Main Database - Chỉ kết nối DB chính)
  # DB chính sẽ tự động truy vấn các phân mảnh thông qua Linked Server
  # Kết nối qua VPN/mạng ảo đến IP 10.241.78.94
  datasource:
    jdbc-url: jdbc:sqlserver://10.241.78.94:1433;databaseName=NGANHANG;encrypt=false;trustServerCertificate=true;loginTimeout=10
    username: HTKN
    password: '123456'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
